services:
  - type: web
    name: sawa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sawa-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: sawa-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sawa-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sawa-api.onrender.com,https://sawa-frontend.onrender.com
      - key: SECURE_PROXY_SSL_HEADER
        value: HTTP_X_FORWARDED_PROTO
      - key: SEED_DEMO_PASSWORD
        sync: false

  - type: web
    name: sawa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sawa-api.onrender.com

databases:
  - name: sawa-db
    plan: free
